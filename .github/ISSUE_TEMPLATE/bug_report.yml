name: Bug report
description: Report something that isn't working as expected
labels: ['status: needs-triage', 'bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search the
        [issue tracker](https://github.com/liolocs/powerups/issues) first to
        make sure it hasn't already been reported.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What you expected to happen instead.
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Which command?
      description: The `pup` command this relates to, if any.
      options:
        - add
        - create
        - doctor
        - find
        - info
        - install
        - list
        - metrics
        - pack
        - project
        - update
        - use
        - validate
        - Other / not command-specific
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        The steps to reproduce, including the exact command(s) you ran.
        Wrap commands in a code block.
      value: |
        ```
        pup <command>
        ```
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        The `pup` version, Node version, and OS.
        If relevant, paste the output of `pup doctor`.
      value: |
        - pup version:
        - Node version:
        - OS:
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots, or `--debug` output. Optional.
    validations:
      required: false